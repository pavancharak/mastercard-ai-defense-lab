# fly.toml app configuration for the Mastercard Innovation Challenge web
# prototype (web-prototype/). Build context is the repo root -- see
# Dockerfile's own note on why.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'mastercard-ai-defense-lab'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

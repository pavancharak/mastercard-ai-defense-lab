[project]
name = "mandate-demo"
version = "0.1.0"
description = "C3 (Delegated Mandate Scope Abuse) structural-prevention demo: a local, honestly-labeled reimplementation of Parmana's mandate-binding pattern as a second, non-ML layer alongside Defend's classifier."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "requests>=2.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
